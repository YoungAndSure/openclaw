<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="650" viewBox="0 0 1250 650" role="img" aria-label="OpenClaw Gateway 层次架构">
  <defs>
    <style>
      .rpc { fill: #d4e9f7; stroke: #1a6b7c; stroke-width: 2; }
      .routing { fill: #e8f4e0; stroke: #3d7a3d; stroke-width: 2; }
      .routing-inner { fill: #d8eed8; stroke: #2d6a2d; stroke-width: 1; }
      .agent { fill: #e8e0f4; stroke: #5a4a9a; stroke-width: 2; }
      .agent-inner { fill: #d8d0e8; stroke: #4a3a8a; stroke-width: 1; }
      .channel { fill: #fff4e0; stroke: #b86b00; stroke-width: 2; }
      .external { fill: #f0f0f0; stroke: #666; stroke-width: 2; }
      .cli { fill: #f5f0e8; stroke: #8b7355; stroke-width: 2; }
      .control-ui { fill: #e8f0f5; stroke: #4a7c9a; stroke-width: 2; }
      .divider { stroke: #bbb; stroke-width: 1; stroke-dasharray: 6 3; fill: none; }
      .text { font: 13px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .label { font: 11px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #333; }
      .title { font: bold 15px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .layer-label { font: bold 11px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #555; }
      .inner-label { font: 10px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #444; }
      .inner-desc { font: 9px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #555; }
      .inner-label-long { font: 9px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #444; }
      .zone-label { font: 10px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #aaa; }
      .arrow { stroke: #2b2b2b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .arrow-bidi { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrow2); marker-start: url(#arrow2-rev); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b2b2b" />
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666" />
    </marker>
    <marker id="arrow2-rev" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666" />
    </marker>
  </defs>

  <!-- Title -->
  <text class="title" x="625" y="30" text-anchor="middle">OpenClaw Gateway &#23618;&#27425;&#26550;&#26500;</text>
  <text class="label" x="625" y="48" text-anchor="middle">&#21333;&#19968; Node.js &#36827;&#31243;&#65307;&#31471;&#21475; 18789</text>

  <!-- Zone separator: gap between CtrlUI right-edge x=150 and RPC left-edge x=230 -->
  <!-- Dashed line at x=192 (centred in the 80-px gap) -->
  <line class="divider" x1="192" y1="55" x2="192" y2="432" />
  <text class="zone-label" x="85"  y="53" text-anchor="middle">&#23458;&#25143;&#31471;</text>
  <text class="zone-label" x="425" y="53" text-anchor="middle">OpenClaw Gateway</text>

  <!-- Left clients (right-edge x=150) -->
  <rect class="cli" x="20" y="60" width="130" height="50" rx="8" />
  <text class="text" x="85" y="80" text-anchor="middle">OpenClaw CLI</text>
  <text class="label" x="85" y="96" text-anchor="middle">RPC &#35843;&#29992;</text>

  <rect class="control-ui" x="20" y="124" width="130" height="50" rx="8" />
  <text class="text" x="85" y="144" text-anchor="middle">Control UI</text>
  <text class="label" x="85" y="160" text-anchor="middle">&#27983;&#35272;&#22120; WebSocket</text>

  <!-- RPC Server (left-edge x=230, 80 px right of clients) -->
  <rect class="rpc" x="230" y="60" width="390" height="60" rx="8" />
  <text class="layer-label" x="250" y="80" text-anchor="start">RPC Server</text>
  <text class="text" x="425" y="102" text-anchor="middle">HTTP / WebSocket&#65288;&#31471;&#21475; 18789&#65289;</text>

  <!-- CLI to RPC: horizontal arrow, crosses separator -->
  <line class="arrow" x1="150" y1="85" x2="230" y2="85" />
  <!-- CtrlUI to RPC: right to x=220 (gap, right of separator), up, right into RPC -->
  <path class="arrow" d="M 150 149 L 220 149 L 220 108 L 230 108" fill="none" />

  <!-- RPC to Routing -->
  <line class="arrow" x1="425" y1="120" x2="425" y2="140" />

  <!-- Routing box: x=230-620, y=140-430 -->
  <rect class="routing" x="230" y="140" width="390" height="290" rx="8" />
  <text class="layer-label" x="250" y="160" text-anchor="start">&#28040;&#24687;&#20998;&#21457;&#19982;&#36335;&#30001;</text>

  <!-- Inbound: resolveAgentRoute -->
  <rect class="routing-inner" x="245" y="172" width="130" height="66" rx="4" />
  <text class="inner-label" x="255" y="189" text-anchor="start">resolveAgentRoute</text>
  <text class="inner-desc" x="255" y="204" text-anchor="start">bindings &#8594; agentId</text>
  <text class="inner-desc" x="255" y="217" text-anchor="start">sessionKey</text>

  <line class="arrow" x1="310" y1="238" x2="310" y2="250" />

  <!-- Inbound: dispatchInboundMessage -->
  <rect class="routing-inner" x="245" y="250" width="130" height="66" rx="4" />
  <text class="inner-label-long" x="255" y="267" text-anchor="start">dispatchInbound</text>
  <text class="inner-label-long" x="255" y="280" text-anchor="start">Message</text>
  <text class="inner-desc" x="255" y="296" text-anchor="start">&#20837;&#21475;&#21327;&#35843;&#65292;&#25237;&#36882;&#21040; Agent</text>

  <!-- Outbound: resolveAgentDeliveryPlan -->
  <rect class="routing-inner" x="390" y="172" width="130" height="66" rx="4" />
  <text class="inner-label-long" x="400" y="189" text-anchor="start">resolveAgentDelivery</text>
  <text class="inner-label-long" x="400" y="202" text-anchor="start">Plan</text>
  <text class="inner-desc" x="400" y="218" text-anchor="start">&#30830;&#23450;&#22238;&#22797;&#30446;&#26631;</text>

  <line class="arrow" x1="455" y1="238" x2="455" y2="250" />

  <!-- Outbound: routeReply -->
  <rect class="routing-inner" x="390" y="250" width="130" height="66" rx="4" />
  <text class="inner-label" x="400" y="267" text-anchor="start">routeReply</text>
  <text class="inner-desc" x="400" y="282" text-anchor="start">payload &#8594; &#28192;&#36947;&#23458;&#25143;&#31471;</text>

  <!-- node.invoke col -->
  <rect class="routing-inner" x="535" y="172" width="75" height="144" rx="4" />
  <text class="inner-label" x="545" y="190" text-anchor="start">&#36716;&#21457;</text>
  <text class="inner-label" x="545" y="204" text-anchor="start">node.invoke</text>
  <text class="inner-desc" x="545" y="228" text-anchor="start">nodes &#24037;&#20855;</text>
  <text class="inner-desc" x="545" y="242" text-anchor="start">&#8594; Node &#33410;&#28857;</text>

  <!-- Agent box: x=670-1230, y=60-430 -->
  <rect class="agent" x="670" y="60" width="560" height="370" rx="8" />
  <text class="layer-label" x="690" y="80" text-anchor="start">Agent &#25191;&#34892;&#27969;&#31243;</text>

  <!-- pi-agent runtime -->
  <rect class="agent-inner" x="690" y="88" width="520" height="56" rx="4" />
  <text class="inner-label" x="702" y="108" text-anchor="start">pi-agent &#36816;&#34892;&#26102;</text>
  <text class="inner-desc" x="702" y="124" text-anchor="start">&#27969;&#24335; / &#38431;&#21015; / steer-followup</text>

  <line class="arrow" x1="950" y1="144" x2="950" y2="156" />

  <!-- Agent executor -->
  <rect class="agent-inner" x="690" y="156" width="520" height="70" rx="4" />
  <text class="inner-label" x="702" y="176" text-anchor="start">Agent &#25191;&#34892;&#22120;</text>
  <text class="inner-desc" x="702" y="192" text-anchor="start">20+ tools&#65288;&#21253;&#25324; nodes&#65289;</text>
  <text class="inner-desc" x="702" y="207" text-anchor="start">&#20250;&#35805;&#12289;&#33410;&#28857;&#35843;&#24207;</text>

  <line class="arrow" x1="950" y1="226" x2="950" y2="238" />

  <!-- Tool pipeline -->
  <rect class="agent-inner" x="690" y="238" width="520" height="56" rx="4" />
  <text class="inner-label" x="702" y="258" text-anchor="start">&#24037;&#20855;&#31649;&#36947;</text>
  <text class="inner-desc" x="702" y="273" text-anchor="start">&#31574;&#30053; &#8594; &#26435;&#38480; &#8594; &#38075;&#23376; &#8594; AbortSignal</text>

  <line class="arrow" x1="950" y1="294" x2="950" y2="306" />

  <!-- getReply / Reply -->
  <rect class="agent-inner" x="690" y="306" width="520" height="56" rx="4" />
  <text class="inner-label" x="702" y="326" text-anchor="start">getReply / Reply</text>
  <text class="inner-desc" x="702" y="341" text-anchor="start">&#27969;&#24335;&#22238;&#22797;&#12289;payload</text>

  <!-- Cross-box connections (gap x=620-670) -->
  <line class="arrow-bidi" x1="620" y1="90"  x2="670" y2="90"  />
  <line class="arrow-bidi" x1="620" y1="244" x2="670" y2="244" />

  <!-- Channel clients (aligns with routing box x=230-620) -->
  <rect class="channel" x="230" y="468" width="390" height="72" rx="8" />
  <text class="layer-label" x="250" y="488" text-anchor="start">&#28192;&#36947;&#23458;&#25143;&#31471;</text>
  <text class="inner-desc"  x="250" y="502" text-anchor="start">WebSocket &#8592; &#27880;&#20876;&#21040; Gateway</text>
  <text class="text" x="425" y="524" text-anchor="middle">Telegram &#183; Discord &#183; Slack &#183; Feishu ...</text>

  <!-- Node nodes (right of channel box) -->
  <rect class="channel" x="638" y="468" width="205" height="72" rx="8" />
  <text class="layer-label" x="658" y="488" text-anchor="start">Node &#33410;&#28857;</text>
  <text class="text" x="740" y="510" text-anchor="middle">&#26412;&#22320; / iOS / Android</text>
  <text class="text" x="740" y="526" text-anchor="middle">Headless</text>

  <!-- Inbound: channel -> resolveAgentRoute
       Path stays in gap x=172-230 (22 px right of CtrlUI right-edge x=150,
       never reaches CtrlUI y-range because only x=180 enters routing box):
         start at channel left-edge (230,504)
         -> left to x=172 (in the gap, well clear of CtrlUI at x=20-150)
         -> up to y=432 (routing box bottom)
         -> right 8px into routing left margin: x=180
         -> up through routing left margin to y=205 (resolveAgentRoute mid)
         -> right into resolveAgentRoute at x=245 -->
  <path class="arrow" d="M 230 504 L 172 504 L 172 432 L 180 432 L 180 205 L 245 205" fill="none" />

  <!-- Outbound: routeReply -> channel (L-shape, waypoint y=445) -->
  <path class="arrow" d="M 455 316 L 455 445 L 370 445 L 370 468" fill="none" />

  <!-- node.invoke -> Node nodes (same waypoint y=445, turns right) -->
  <path class="arrow" d="M 572 316 L 572 445 L 740 445 L 740 468" fill="none" />

  <!-- External servers -->
  <rect class="external" x="230" y="558" width="115" height="50" rx="8" />
  <text class="text" x="287" y="580" text-anchor="middle">Feishu</text>
  <text class="label" x="287" y="596" text-anchor="middle">open.feishu.cn</text>

  <rect class="external" x="355" y="558" width="125" height="50" rx="8" />
  <text class="text" x="417" y="580" text-anchor="middle">Telegram</text>
  <text class="label" x="417" y="596" text-anchor="middle">api.telegram.org</text>

  <rect class="external" x="490" y="558" width="130" height="50" rx="8" />
  <text class="text" x="555" y="580" text-anchor="middle">Discord / Slack ...</text>

  <!-- Channel <-> External (bidirectional, straight down) -->
  <line class="arrow-bidi" x1="287" y1="540" x2="287" y2="558" />
  <line class="arrow-bidi" x1="417" y1="540" x2="417" y2="558" />
  <line class="arrow-bidi" x1="555" y1="540" x2="555" y2="558" />

</svg>
