<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="530" viewBox="0 0 900 530" role="img" aria-label="OpenClaw Gateway &#23618;&#27425;&#26550;&#26500;">
  <defs>
    <style>
      .rpc { fill: #d4e9f7; stroke: #1a6b7c; stroke-width: 2; }
      .routing { fill: #e8f4e0; stroke: #3d7a3d; stroke-width: 2; }
      .routing-inner { fill: #d8eed8; stroke: #2d6a2d; stroke-width: 1; }
      .agent { fill: #e8e0f4; stroke: #5a4a9a; stroke-width: 2; }
      .agent-inner { fill: #d8d0e8; stroke: #4a3a8a; stroke-width: 1; }
      .channel { fill: #fff4e0; stroke: #b86b00; stroke-width: 2; }
      .external { fill: #f0f0f0; stroke: #666; stroke-width: 2; }
      .cli { fill: #f5f0e8; stroke: #8b7355; stroke-width: 2; }
      .control-ui { fill: #e8f0f5; stroke: #4a7c9a; stroke-width: 2; }
      .gateway-dash { fill: none; stroke: #1a6b7c; stroke-width: 1.5; stroke-dasharray: 8 4; }
      .text { font: 13px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .label { font: 11px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #333; }
      .title { font: bold 15px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .layer-label { font: bold 10px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #555; }
      .inner-label { font: 10px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #444; }
      .inner-desc { font: 9px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #555; }
      .arrow { stroke: #2b2b2b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .arrow-bidi { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrow2); marker-start: url(#arrow2-rev); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b2b2b" />
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666" />
    </marker>
    <marker id="arrow2-rev" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666" />
    </marker>
  </defs>

  <!-- Title -->
  <text class="title" x="450" y="26" text-anchor="middle">OpenClaw Gateway &#23618;&#27425;&#26550;&#26500;</text>
  <text class="label" x="450" y="42" text-anchor="middle">&#21333;&#19968; Node.js &#36827;&#31243;&#65307;&#31471;&#21475; 18789</text>

  <!-- CLI -->
  <rect class="cli" x="25" y="52" width="100" height="44" rx="8" />
  <text class="text" x="75" y="74" text-anchor="middle">OpenClaw CLI</text>
  <text class="label" x="75" y="88" text-anchor="middle">RPC &#35843;&#29992;</text>

  <!-- Control UI -->
  <rect class="control-ui" x="25" y="108" width="100" height="44" rx="8" />
  <text class="text" x="75" y="130" text-anchor="middle">Control UI</text>
  <text class="label" x="75" y="144" text-anchor="middle">&#27983;&#35272;&#22120; WebSocket</text>

  <!-- Gateway dashed boundary (Channel inside; External servers outside) -->
  <rect class="gateway-dash" x="145" y="52" width="600" height="368" rx="10" />
  <text class="layer-label" x="165" y="68" text-anchor="start">Gateway &#36827;&#31243;</text>

  <!-- RPC Server -->
  <rect class="rpc" x="165" y="88" width="570" height="48" rx="8" />
  <text class="layer-label" x="185" y="105" text-anchor="start">RPC Server</text>
  <text class="text" x="450" y="124" text-anchor="middle">HTTP / WebSocket &#65288;&#31471;&#21475; 18789&#65289;</text>

  <!-- CLI / Control UI → RPC -->
  <line class="arrow" x1="125" y1="74" x2="165" y2="112" />
  <line class="arrow" x1="125" y1="130" x2="165" y2="112" />

  <!-- 消息分发与路由 (center, expanded) -->
  <rect class="routing" x="280" y="152" width="210" height="208" rx="8" />
  <text class="layer-label" x="300" y="170" text-anchor="start">&#28040;&#24687;&#20998;&#21457;&#19982;&#36335;&#30001;</text>
  <rect class="routing-inner" x="295" y="180" width="180" height="38" rx="4" />
  <text class="inner-label" x="305" y="195" text-anchor="start">resolveAgentRoute</text>
  <text class="inner-desc" x="305" y="208" text-anchor="start">bindings&#8594;agentId&#12289;sessionKey</text>
  <rect class="routing-inner" x="295" y="224" width="180" height="38" rx="4" />
  <text class="inner-label" x="305" y="239" text-anchor="start">resolveAgentDeliveryPlan</text>
  <text class="inner-desc" x="305" y="252" text-anchor="start">&#30830;&#23450;&#22238;&#22797;&#30446;&#26631;</text>
  <rect class="routing-inner" x="295" y="268" width="180" height="38" rx="4" />
  <text class="inner-label" x="305" y="283" text-anchor="start">routeReply</text>
  <text class="inner-desc" x="305" y="296" text-anchor="start">payload&#8594;&#28192;&#36947;&#23458;&#25143;&#31471;</text>
  <rect class="routing-inner" x="295" y="312" width="180" height="38" rx="4" />
  <text class="inner-label" x="305" y="327" text-anchor="start">dispatchInboundMessage</text>
  <text class="inner-desc" x="305" y="340" text-anchor="start">&#20837;&#21475;&#21327;&#35843;</text>

  <!-- Agent (right, expanded) -->
  <rect class="agent" x="520" y="152" width="215" height="208" rx="8" />
  <text class="layer-label" x="540" y="170" text-anchor="start">Agent</text>
  <rect class="agent-inner" x="535" y="180" width="185" height="38" rx="4" />
  <text class="inner-label" x="545" y="195" text-anchor="start">Session</text>
  <text class="inner-desc" x="545" y="208" text-anchor="start">&#20250;&#35805;&#23384;&#20648;&#12289;&#36755;&#20837;&#36755;&#20986;</text>
  <rect class="agent-inner" x="535" y="224" width="185" height="38" rx="4" />
  <text class="inner-label" x="545" y="239" text-anchor="start">Model / Provider</text>
  <text class="inner-desc" x="545" y="252" text-anchor="start">&#27169;&#22411;&#36873;&#25321;&#12289;API &#35843;&#29992;</text>
  <rect class="agent-inner" x="535" y="268" width="185" height="38" rx="4" />
  <text class="inner-label" x="545" y="283" text-anchor="start">Tools</text>
  <text class="inner-desc" x="545" y="296" text-anchor="start">&#24037;&#20855;&#27880;&#20876;&#12289;&#25191;&#34892;</text>
  <rect class="agent-inner" x="535" y="312" width="185" height="38" rx="4" />
  <text class="inner-label" x="545" y="327" text-anchor="start">getReply / Reply</text>
  <text class="inner-desc" x="545" y="340" text-anchor="start">&#27969;&#24335;&#22238;&#22797;&#12289;payload</text>

  <!-- RPC → Routing / Agent -->
  <line class="arrow" x1="380" y1="136" x2="380" y2="152" />
  <line class="arrow" x1="600" y1="136" x2="617" y2="152" />

  <!-- Routing ↔ Agent -->
  <line class="arrow-bidi" x1="490" y1="256" x2="520" y2="256" />

  <!-- Channel clients -->
  <rect class="channel" x="165" y="368" width="550" height="48" rx="8" />
  <text class="layer-label" x="185" y="385" text-anchor="start">&#28192;&#36947;&#23458;&#25143;&#31471;</text>
  <text class="text" x="440" y="406" text-anchor="middle">Feishu WebSocket&#12289;Telegram&#12289;Discord / Slack ...</text>

  <!-- Routing ↔ Channel -->
  <line class="arrow-bidi" x1="380" y1="360" x2="380" y2="368" />

  <!-- External servers (outside Gateway) -->
  <rect class="external" x="165" y="432" width="140" height="44" rx="8" />
  <text class="text" x="235" y="453" text-anchor="middle">Feishu</text>
  <text class="label" x="235" y="466" text-anchor="middle">open.feishu.cn</text>

  <rect class="external" x="320" y="432" width="140" height="44" rx="8" />
  <text class="text" x="390" y="453" text-anchor="middle">Telegram</text>
  <text class="label" x="390" y="466" text-anchor="middle">api.telegram.org</text>

  <rect class="external" x="475" y="432" width="240" height="44" rx="8" />
  <text class="text" x="595" y="453" text-anchor="middle">Discord / Slack / &#20854;&#20182;&#22806;&#37096;&#24179;&#21488;</text>

  <!-- Bidirectional: Channel ↔ External -->
  <line class="arrow-bidi" x1="235" y1="416" x2="235" y2="432" />
  <line class="arrow-bidi" x1="390" y1="416" x2="390" y2="432" />
  <line class="arrow-bidi" x1="595" y1="416" x2="595" y2="432" />
</svg>
