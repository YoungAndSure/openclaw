<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-label="OpenClaw Gateway &#23618;&#27425;&#26550;&#26500;">
  <defs>
    <style>
      .rpc { fill: #d4e9f7; stroke: #1a6b7c; stroke-width: 2; }
      .routing { fill: #e8f4e0; stroke: #3d7a3d; stroke-width: 2; }
      .agent { fill: #e8e0f4; stroke: #5a4a9a; stroke-width: 2; }
      .channel { fill: #fff4e0; stroke: #b86b00; stroke-width: 2; }
      .external { fill: #f0f0f0; stroke: #666; stroke-width: 2; }
      .cli { fill: #f5f0e8; stroke: #8b7355; stroke-width: 2; }
      .control-ui { fill: #e8f0f5; stroke: #4a7c9a; stroke-width: 2; }
      .gateway-dash { fill: none; stroke: #1a6b7c; stroke-width: 1.5; stroke-dasharray: 8 4; }
      .text { font: 13px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .label { font: 11px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #333; }
      .title { font: bold 15px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .layer-label { font: bold 10px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #555; }
      .arrow { stroke: #2b2b2b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .arrow-bidi { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrow2); marker-start: url(#arrow2-rev); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b2b2b" />
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666" />
    </marker>
    <marker id="arrow2-rev" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666" />
    </marker>
  </defs>

  <!-- Title -->
  <text class="title" x="380" y="26" text-anchor="middle">OpenClaw Gateway &#23618;&#27425;&#26550;&#26500;</text>
  <text class="label" x="380" y="42" text-anchor="middle">&#21333;&#19968; Node.js &#36827;&#31243;&#65307;&#31471;&#21475; 18789</text>

  <!-- CLI -->
  <rect class="cli" x="25" y="52" width="100" height="44" rx="8" />
  <text class="text" x="75" y="74" text-anchor="middle">OpenClaw CLI</text>
  <text class="label" x="75" y="88" text-anchor="middle">RPC &#35843;&#29992;</text>

  <!-- Control UI -->
  <rect class="control-ui" x="25" y="108" width="100" height="44" rx="8" />
  <text class="text" x="75" y="130" text-anchor="middle">Control UI</text>
  <text class="label" x="75" y="144" text-anchor="middle">&#27983;&#35272;&#22120; WebSocket</text>

  <!-- Gateway dashed boundary -->
  <rect class="gateway-dash" x="145" y="52" width="470" height="248" rx="10" />
  <text class="layer-label" x="165" y="68" text-anchor="start">Gateway &#36827;&#31243;</text>

  <!-- RPC Server -->
  <rect class="rpc" x="165" y="88" width="440" height="48" rx="8" />
  <text class="layer-label" x="185" y="105" text-anchor="start">RPC Server</text>
  <text class="text" x="385" y="124" text-anchor="middle">HTTP / WebSocket &#65288;&#31471;&#21475; 18789&#65289;</text>

  <!-- CLI → RPC Server -->
  <line class="arrow" x1="125" y1="74" x2="165" y2="112" />

  <!-- Control UI → RPC Server -->
  <line class="arrow" x1="125" y1="130" x2="165" y2="112" />

  <!-- 消息分发与路由 -->
  <rect class="routing" x="165" y="152" width="250" height="48" rx="8" />
  <text class="layer-label" x="185" y="168" text-anchor="start">&#28040;&#24687;&#20998;&#21457;&#19982;&#36335;&#30001;</text>
  <text class="label" x="290" y="184" text-anchor="middle">resolveAgentRoute&#12289;deliveryPlan</text>

  <!-- Agent (separate) -->
  <rect class="agent" x="435" y="152" width="170" height="48" rx="8" />
  <text class="layer-label" x="455" y="168" text-anchor="start">Agent</text>
  <text class="label" x="520" y="184" text-anchor="middle">&#21518;&#32493;&#32487;&#32493;&#32454;&#21270;</text>

  <!-- RPC → Routing -->
  <line class="arrow" x1="385" y1="136" x2="290" y2="152" />

  <!-- Routing ↔ Agent (single bidirectional) -->
  <line class="arrow-bidi" x1="415" y1="176" x2="435" y2="176" />

  <!-- Channel clients -->
  <rect class="channel" x="165" y="218" width="440" height="48" rx="8" />
  <text class="layer-label" x="185" y="234" text-anchor="start">&#28192;&#36947;&#23458;&#25143;&#31471;</text>
  <text class="text" x="385" y="254" text-anchor="middle">Feishu WebSocket&#12289;Telegram&#12289;Discord / Slack ...</text>

  <!-- Routing ↔ Channel -->
  <line class="arrow-bidi" x1="290" y1="200" x2="290" y2="218" />

  <!-- External servers (bottom) -->
  <rect class="external" x="165" y="288" width="130" height="42" rx="8" />
  <text class="text" x="230" y="309" text-anchor="middle">Feishu</text>
  <text class="label" x="230" y="322" text-anchor="middle">open.feishu.cn</text>

  <rect class="external" x="310" y="288" width="130" height="42" rx="8" />
  <text class="text" x="375" y="309" text-anchor="middle">Telegram</text>
  <text class="label" x="375" y="322" text-anchor="middle">api.telegram.org</text>

  <rect class="external" x="455" y="288" width="150" height="42" rx="8" />
  <text class="text" x="530" y="309" text-anchor="middle">Discord / ...</text>
  <text class="label" x="530" y="322" text-anchor="middle">&#22806;&#37096;&#24179;&#21488;</text>

  <!-- Bidirectional: Channel ↔ External -->
  <line class="arrow-bidi" x1="230" y1="288" x2="230" y2="266" />
  <line class="arrow-bidi" x1="375" y1="288" x2="375" y2="266" />
  <line class="arrow-bidi" x1="530" y1="288" x2="530" y2="266" />
</svg>
