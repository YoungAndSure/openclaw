<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-label="OpenClaw Gateway &#23618;&#27425;&#26550;&#26500;">
  <defs>
    <style>
      .rpc { fill: #d4e9f7; stroke: #1a6b7c; stroke-width: 2; }
      .routing { fill: #e8f4e0; stroke: #3d7a3d; stroke-width: 2; }
      .routing-inner { fill: #d8eed8; stroke: #2d6a2d; stroke-width: 1; }
      .agent { fill: #e8e0f4; stroke: #5a4a9a; stroke-width: 2; }
      .agent-inner { fill: #d8d0e8; stroke: #4a3a8a; stroke-width: 1; }
      .channel { fill: #fff4e0; stroke: #b86b00; stroke-width: 2; }
      .external { fill: #f0f0f0; stroke: #666; stroke-width: 2; }
      .cli { fill: #f5f0e8; stroke: #8b7355; stroke-width: 2; }
      .control-ui { fill: #e8f0f5; stroke: #4a7c9a; stroke-width: 2; }
      .text { font: 13px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .label { font: 11px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #333; }
      .title { font: bold 15px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #1a1a1a; }
      .layer-label { font: bold 10px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #555; }
      .inner-label { font: 10px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #444; }
      .inner-desc { font: 9px "SF Pro Text", -apple-system, Helvetica, Arial, sans-serif; fill: #555; }
      .arrow { stroke: #2b2b2b; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .arrow-bidi { stroke: #666; stroke-width: 1.5; fill: none; marker-end: url(#arrow2); marker-start: url(#arrow2-rev); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2b2b2b" />
    </marker>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666" />
    </marker>
    <marker id="arrow2-rev" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#666" />
    </marker>
  </defs>

  <!-- Title -->
  <text class="title" x="450" y="26" text-anchor="middle">OpenClaw Gateway &#23618;&#27425;&#26550;&#26500;</text>
  <text class="label" x="450" y="42" text-anchor="middle">&#21333;&#19968; Node.js &#36827;&#31243;&#65307;&#31471;&#21475; 18789</text>

  <!-- CLI -->
  <rect class="cli" x="25" y="52" width="100" height="44" rx="8" />
  <text class="text" x="75" y="74" text-anchor="middle">OpenClaw CLI</text>
  <text class="label" x="75" y="88" text-anchor="middle">RPC &#35843;&#29992;</text>

  <!-- Control UI -->
  <rect class="control-ui" x="25" y="108" width="100" height="44" rx="8" />
  <text class="text" x="75" y="130" text-anchor="middle">Control UI</text>
  <text class="label" x="75" y="144" text-anchor="middle">&#27983;&#35272;&#22120; WebSocket</text>

  <!-- RPC Server -->
  <rect class="rpc" x="165" y="88" width="320" height="48" rx="8" />
  <text class="layer-label" x="185" y="105" text-anchor="start">RPC Server</text>
  <text class="text" x="325" y="124" text-anchor="middle">HTTP / WebSocket &#65288;&#31471;&#21475; 18789&#65289;</text>

  <!-- CLI / Control UI → RPC -->
  <line class="arrow" x1="125" y1="74" x2="165" y2="112" />
  <line class="arrow" x1="125" y1="130" x2="165" y2="112" />

  <!-- 消息分发与路由 -->
  <rect class="routing" x="165" y="152" width="320" height="208" rx="8" />
  <text class="layer-label" x="185" y="170" text-anchor="start">&#28040;&#24687;&#20998;&#21457;&#19982;&#36335;&#30001;</text>
  <rect class="routing-inner" x="180" y="180" width="290" height="38" rx="4" />
  <text class="inner-label" x="190" y="195" text-anchor="start">resolveAgentRoute</text>
  <text class="inner-desc" x="190" y="208" text-anchor="start">bindings&#8594;agentId&#12289;sessionKey</text>
  <rect class="routing-inner" x="180" y="224" width="290" height="38" rx="4" />
  <text class="inner-label" x="190" y="239" text-anchor="start">resolveAgentDeliveryPlan</text>
  <text class="inner-desc" x="190" y="252" text-anchor="start">&#30830;&#23450;&#22238;&#22797;&#30446;&#26631;</text>
  <rect class="routing-inner" x="180" y="268" width="290" height="38" rx="4" />
  <text class="inner-label" x="190" y="283" text-anchor="start">routeReply</text>
  <text class="inner-desc" x="190" y="296" text-anchor="start">payload&#8594;&#28192;&#36947;&#23458;&#25143;&#31471;</text>
  <rect class="routing-inner" x="180" y="312" width="290" height="38" rx="4" />
  <text class="inner-label" x="190" y="327" text-anchor="start">dispatchInboundMessage</text>
  <text class="inner-desc" x="190" y="340" text-anchor="start">&#20837;&#21475;&#21327;&#35843;</text>

  <!-- Agent (右侧独立) -->
  <rect class="agent" x="530" y="88" width="340" height="284" rx="8" />
  <text class="layer-label" x="550" y="108" text-anchor="start">Agent &#25191;&#34892;&#27969;&#31243;</text>
  <rect class="agent-inner" x="545" y="118" width="310" height="32" rx="4" />
  <text class="inner-label" x="555" y="133" text-anchor="start">pi-agent &#36816;&#34892;&#26102;</text>
  <text class="inner-desc" x="555" y="144" text-anchor="start">&#27969;&#24335;/&#38431;&#21015;/steer-followup</text>
  <rect class="agent-inner" x="545" y="156" width="310" height="32" rx="4" />
  <text class="inner-label" x="555" y="171" text-anchor="start">Agent &#25191;&#34892;&#22120;</text>
  <text class="inner-desc" x="555" y="182" text-anchor="start">20+ tools&#12289;&#20250;&#35805;&#12289;&#33410;&#28857;&#35843;&#24207;</text>
  <rect class="agent-inner" x="545" y="194" width="310" height="28" rx="4" />
  <text class="inner-label" x="555" y="207" text-anchor="start">&#24037;&#20855;&#31649;&#36947;</text>
  <text class="inner-desc" x="555" y="218" text-anchor="start">&#31574;&#30053;&#8594;&#26435;&#38480;&#8594;&#38075;&#23376;&#8594;AbortSignal</text>
  <rect class="agent-inner" x="545" y="228" width="310" height="28" rx="4" />
  <text class="inner-label" x="555" y="241" text-anchor="start">getReply / Reply</text>
  <text class="inner-desc" x="555" y="252" text-anchor="start">&#27969;&#24335;&#22238;&#22797;&#12289;payload</text>
  <!-- Flow arrows within Agent -->
  <line class="arrow" x1="700" y1="150" x2="700" y2="156" />
  <line class="arrow" x1="700" y1="188" x2="700" y2="194" />
  <line class="arrow" x1="700" y1="222" x2="700" y2="228" />

  <!-- RPC → Routing -->
  <line class="arrow" x1="325" y1="136" x2="325" y2="152" />

  <!-- RPC ↔ Agent -->
  <line class="arrow-bidi" x1="485" y1="112" x2="530" y2="112" />

  <!-- Routing ↔ Agent -->
  <line class="arrow-bidi" x1="485" y1="256" x2="530" y2="256" />

  <!-- Channel clients -->
  <rect class="channel" x="165" y="376" width="320" height="48" rx="8" />
  <text class="layer-label" x="185" y="393" text-anchor="start">&#28192;&#36947;&#23458;&#25143;&#31471;</text>
  <text class="text" x="325" y="414" text-anchor="middle">Feishu WebSocket&#12289;Telegram&#12289;Discord / Slack ...</text>

  <!-- Node 节点 (Agent 调度目标，右侧，WebSocket 控制平面) -->
  <text class="layer-label" x="540" y="445" text-anchor="start">Node &#33410;&#28857;</text>
  <rect class="channel" x="530" y="432" width="75" height="28" rx="4" />
  <text class="inner-label" x="567" y="450" text-anchor="middle">&#26412;&#22320;</text>
  <rect class="channel" x="615" y="432" width="75" height="28" rx="4" />
  <text class="inner-label" x="652" y="450" text-anchor="middle">iOS</text>
  <rect class="channel" x="700" y="432" width="75" height="28" rx="4" />
  <text class="inner-label" x="737" y="450" text-anchor="middle">Android</text>
  <rect class="channel" x="785" y="432" width="75" height="28" rx="4" />
  <text class="inner-label" x="822" y="450" text-anchor="middle">Headless</text>
  <text class="inner-desc" x="540" y="467" text-anchor="start">WebSocket &#25511;&#21046;&#24179;&#38754;</text>

  <!-- Agent 工具管道 → Node 节点 -->
  <line class="arrow" x1="700" y1="372" x2="700" y2="432" />

  <!-- Routing ↔ Channel -->
  <line class="arrow-bidi" x1="325" y1="360" x2="325" y2="376" />

  <!-- External servers (与渠道客户端平齐) -->
  <rect class="external" x="165" y="484" width="95" height="44" rx="8" />
  <text class="text" x="212" y="505" text-anchor="middle">Feishu</text>
  <text class="label" x="212" y="518" text-anchor="middle">open.feishu.cn</text>

  <rect class="external" x="270" y="484" width="95" height="44" rx="8" />
  <text class="text" x="317" y="505" text-anchor="middle">Telegram</text>
  <text class="label" x="317" y="518" text-anchor="middle">api.telegram.org</text>

  <rect class="external" x="375" y="484" width="110" height="44" rx="8" />
  <text class="text" x="430" y="505" text-anchor="middle">Discord / Slack ...</text>

  <!-- Bidirectional: Channel ↔ External -->
  <line class="arrow-bidi" x1="212" y1="424" x2="212" y2="484" />
  <line class="arrow-bidi" x1="317" y1="424" x2="317" y2="484" />
  <line class="arrow-bidi" x1="430" y1="424" x2="430" y2="484" />

</svg>
